<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jubilee's Game Library</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>JUBILEE'S GAME LIBRARY</h1>

        <p>
            Game Programmer • Engine Developer • CS Student
        </p>

    </header>


    <main>

        <div class="cartridge-grid">

            <div class="cartridge" data-page="about">

                <div class="label">
                    <span class="icon">🌺</span>

                    <h2>ABOUT</h2>

                    <small>
                        JUBILEE
                    </small>
                </div>

            </div>


            <div class="cartridge" data-page="projects">

                <div class="label">
                    <span class="icon">⚙️</span>

                    <h2>PROJECTS</h2>

                    <small>
                        ENGINE LAB
                    </small>
                </div>

            </div>


            <div class="cartridge" data-page="games">

                <div class="label">
                    <span class="icon">🎮</span>

                    <h2>GAMES</h2>

                    <small>
                        GAME LIBRARY
                    </small>
                </div>

            </div>


            <div class="cartridge" data-page="experience">

                <div class="label">
                    <span class="icon">🌋</span>

                    <h2>EXPERIENCE</h2>

                    <small>
                        ADVENTURE LOG
                    </small>

                </div>

            </div>


            <div class="cartridge" data-page="contact">

                <div class="label">
                    <span class="icon">🌊</span>

                    <h2>CONTACT</h2>

                    <small>
                        COMMUNICATION
                    </small>

                </div>

            </div>

        </div>

    </main>


    <div id="game-screen">

        <button id="close">×</button>

        <div id="content"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
