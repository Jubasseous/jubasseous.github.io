<!DOCTYPE html>
<html>
<head>
    <title>Jubilee Garcia - Portfolio</title>
    <meta charset="utf-8" />
    <meta name="description"
          content="Jubilee Garcia's Portfolio" />
    <!--<meta content="" property="og:title" /> Set this line to be website name, this will be the name shown on other medias-->
    <!--<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>-->
    <!-- stylesheet CSS -->
    <link rel="stylesheet" href="css/typewriterEffect.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sidebarMenu.css" />
    <!-- Boxicons CSS -->
    <link href='https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <nav class="sidebar close">
        <header>
            <div class="image-text">
                <span class="image">
                    <img src="assets/Icon.png" alt="logo" />
                </span>
                <div class="text logo-text">
                    <span class="name">Jubilee Garcia</span>
                    <span class="profession">Game Developer</span>
                </div>
            </div>

            <i class="bx bx-chevron-right toggle"></i>
        </header>

        <div class="menu-bar">
            <div class="menu">
                <!--search-->
                <li class="search-box">
                        <i class="bx bx-search icon"></i>
                        <input type="search" placeholder="Search..." >
                </li>

                <!--other tabs-->
                <ul class="menu-links">
                    <li class="nav-links">
                        <a href="#">
                            <i class="bx bx-island icon"></i>
                            <span class="text nav-tex">Home</span>
                        </a>
                    </li>

                    <li class="nav-links">
                        <a href="#">
                            <i class="bx bx-git-repo-forked icon"></i>
                            <span class="text nav-tex">Projects</span>
                        </a>
                    </li>

                    <li class="nav-links">
                        <a href="#">
                            <i class="bx bx-book-heart icon"></i>
                            <span class="text nav-tex">Blog</span>
                        </a>
                    </li>

                    <li class="nav-links">
                        <a href="#">
                            <i class="bx bx-laugh icon"></i>
                            <span class="text nav-tex">About Me</span>
                        </a>
                    </li>

                    <li class="nav-links">
                        <a href="#">
                            <i class="bx bx-article icon"></i>
                            <span class="text nav-tex">Resume</span>
                        </a>
                    </li>

                    <li class="nav-links">
                        <a href="#">
                            <i class="bx bx-user-id-card icon"></i>
                            <span class="text nav-tex">Contact</span>
                        </a>
                    </li>
                </ul>
            </div>

            <!--dark mode toggle-->
            <div class="bottom-content">
                <li class="mode">
                    <div class="moon-sun">
                        <i class="bx bx-moon icon moon"></i>
                        <i class="bx bx-sun icon sun"></i>
                    </div>
                    <span class="mode-text text">Dark Mode</span>

                    <div class="toggle-switch">
                        <span class="switch"></span>
                    </div>
                </li>
            </div>
        </div>
    </nav>

    <section class="home">
        <div class="text">Home</div>
    </section>
    <script src="js/script.js"></script>
    <!--<h1 id="title">Hello!</h1>
    <button class="button">Click Me</button>-->
    <div class="typewriter">
        <div>
            <h1>Hello, I'm Jubilee Garcia!</h1>
        </div>
    </div>
</body>
</html>
